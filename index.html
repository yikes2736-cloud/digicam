<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>for vrinda 💛</title>
<style>
  :root{
    --lcd-ink:#fdf7ef;
    --lcd-dim:#cbb8c9;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%; width:100%;}
  body{
    width:100%; height:100dvh;
    display:flex; align-items:center; justify-content:center;
    padding:0; margin:0;
    background:#1a1420;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    overflow:hidden;
  }

  .cam-wrap{
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
  }

  /* portrait image (1152 x 2048) rotated 90° clockwise = landscape (2048 x 1152) */
  .cam{
    position:relative;
    width:100vmin;
    aspect-ratio:2048 / 1152;
    filter:drop-shadow(0 8px 16px rgba(0,0,0,.6));
    touch-action:manipulation;
    user-select:none;
  }
  .chassis{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:contain; pointer-events:none;
  }

  /* LCD screen (white viewport on the digicam) */
  .lcd{
    position:absolute;
    /* after 90° rotation, the original vertical bounds become horizontal bounds */
    left:20.1%; top:34.6%; width:30.9%; height:41.4%;
    overflow:hidden;
    background:#0e0b10;
    border-radius:2px;
  }
  .viewport{position:absolute; inset:0; display:grid; place-items:center; background:#141014;}
  .frame-img{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:contain; opacity:0; transition:opacity .28s ease;
    background:#141014;
  }
  .frame-img.show{opacity:1;}
  @media (prefers-reduced-motion:reduce){ .frame-img{transition:none;} }

  /* note frames get a soft warm mat */
  .lcd.is-note .viewport{background:radial-gradient(120% 120% at 50% 20%,#fff7ef,#f3e7dc);}
  .lcd.is-note .frame-img{background:transparent; object-fit:contain;}

  /* tiny status indicator on screen */
  .stat{
    position:absolute; left:5px; top:4px;
    font-family:ui-monospace,Menlo,monospace; font-size:clamp(6px,1.6vw,8px);
    color:var(--lcd-ink); text-shadow:0 1px 2px rgba(0,0,0,.6); opacity:.9;
    display:flex; align-items:center; gap:3px;
  }
  .lcd.is-note .stat{color:#6a4a52; text-shadow:none;}
  .dot{width:4px;height:4px;border-radius:50%;background:#ff5d73;box-shadow:0 0 4px #ff5d73;}

  /* bottom-right tiny caption + counter */
  .hud{
    position:absolute; right:0; bottom:0;
    display:flex; align-items:center; gap:4px;
    padding:3px 4px;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    font-size:clamp(6px,1.5vw,9px); line-height:1;
    color:var(--lcd-ink);
    background:linear-gradient(to top, rgba(8,6,10,.72), rgba(8,6,10,0));
    text-shadow:0 1px 2px rgba(0,0,0,.6);
    transition:opacity .2s ease;
  }
  .lcd.is-note .hud{color:#6a4a52; text-shadow:none;
    background:linear-gradient(to top, rgba(255,255,255,.85), rgba(255,255,255,0));}
  .hud .cap{font-size:clamp(5px,1.4vw,8px); max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .hud .count{opacity:.8; letter-spacing:.3px; font-size:clamp(5px,1.3vw,7px);}
  .lcd.hud-off .hud{opacity:0;}

  /* ---- invisible button hotspots (only these are clickable) ---- */
  .hot{
    position:absolute; border:0; padding:0; margin:0;
    background:transparent; cursor:pointer; border-radius:50%;
    outline-offset:2px;
  }
  .hot:active{background:rgba(255,255,255,.1);}
  .hot:focus-visible{outline:2px solid #ffd166;}

  /* Button positions AFTER 90° clockwise rotation of the original portrait image.
     Original portrait hotspots become rotated. The math: (x,y) in portrait becomes
     (1 - y_ratio, x_ratio) in the rotated 90° image, scaled to the new dimensions.
  */
  
  /* Original pad left (prev): was at 44.5%, 21.6% → now at ~67.9%, 43% */
  .prev { left:67.9%; top:43%;   width:12%; height:11.5%; }
  /* Original left round button (prev2): was at 32.5%, 27.4% → now at ~64.1%, 31% */
  .prev2{ left:64.1%; top:31%;   width:10%; height:12%;  }
  /* Original pad right (next): was at 61.5%, 21.6% → now at ~67.9%, 60% */
  .next { left:67.9%; top:60%;   width:12%; height:11.5%; }
  /* Original right round button (next2): was at 70.5%, 27.4% → now at ~64.1%, 69% */
  .next2{ left:64.1%; top:69%;   width:10%; height:12%;  }
  /* Original pad center (info): was at 53.3%, 22% → now at ~70.5%, 51% */
  .info { left:70.5%; top:51.8%; width:9%;  height:10%;  }
  /* Original top-right button (home): was at 71%, 15% → now at ~76%, 69% */
  .home { left:76%;   top:69.5%; width:10.5%;height:12.5%; }
</style>
</head>
<body>
  <div class="cam-wrap">
    <div class="cam" id="cam">
      <img class="chassis" id="chassis" src="./camera.png" alt="Canon digicam">

      <div class="lcd" id="lcd">
        <div class="viewport" id="viewport">
          <img class="frame-img" id="frameImg" alt="">
        </div>
        <div class="stat" id="stat"><span class="dot"></span><span id="statLabel">PLAY</span></div>
        <div class="hud">
          <span class="cap" id="cap">…</span>
          <span class="count" id="count">0/0</span>
        </div>
      </div>

      <!-- invisible buttons over the real ones — ONLY way to navigate -->
      <button class="hot prev"  id="btnPrev"  aria-label="Previous"></button>
      <button class="hot prev2" id="btnPrev2" aria-label="Previous"></button>
      <button class="hot next"  id="btnNext"  aria-label="Next"></button>
      <button class="hot next2" id="btnNext2" aria-label="Next"></button>
      <button class="hot info"  id="btnInfo"  aria-label="Toggle caption"></button>
      <button class="hot home"  id="btnHome"  aria-label="Back to start"></button>
    </div>
  </div>

  <div style="position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:10;">
    <button id="shareBtn" style="appearance:none;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:#ffeadd;font-size:12px;padding:7px 14px;border-radius:999px;cursor:pointer;backdrop-filter:blur(4px);">show QR code ⧉</button>
  </div>

  <div class="modal" id="modal" style="position:fixed;inset:0;display:none;place-items:center;background:rgba(20,10,18,.72);backdrop-filter:blur(3px);z-index:20;padding:22px;">
    <div style="background:#faf5f0;color:#3a2b30;border-radius:18px;padding:22px 20px;width:min(320px,90vw);text-align:center;box-shadow:0 30px 60px rgba(0,0,0,.5);">
      <h3 style="margin:0 0 4px;font-size:17px;">scan me 💛</h3>
      <p style="margin:0 0 14px;font-size:13px;color:#7a6a6e;">point Vrinda's camera here</p>
      <div id="qrbox" style="display:flex;justify-content:center;margin:0 auto 12px;min-height:180px;align-items:center;">generating…</div>
      <div id="urlText" style="font-size:11px;word-break:break-all;color:#9a8a8e;margin-bottom:14px;"></div>
      <button id="closeModal" style="appearance:none;border:0;background:#3a2b30;color:#fff;padding:9px 18px;border-radius:999px;font-size:13px;cursor:pointer;">close</button>
    </div>
  </div>

<script>
const CONFIG = {
  githubUser: "yikes2736-cloud",
  githubRepo: "digicam",
  branch:     "main",
  notesPath:  "notes",
  photosPath: "photos"
};

const $ = id => document.getElementById(id);
const lcd = $("lcd"), frameImg = $("frameImg");
const cap = $("cap"), count = $("count"), statLabel = $("statLabel");

const IMG_RE = /\.(jpe?g|png|gif|webp|bmp)$/i;

function prettify(name){
  return name.replace(/\.[^.]+$/,"").replace(/^\d+[\s._-]+/,"").replace(/[._-]+/g," ").trim();
}

async function listFolder(path){
  if(!CONFIG.githubUser || !CONFIG.githubRepo) return [];
  const url = `https://api.github.com/repos/${CONFIG.githubUser}/${CONFIG.githubRepo}/contents/${path}?ref=${CONFIG.branch}`;
  try{
    const r = await fetch(url, {headers:{Accept:"application/vnd.github+json"}});
    if(!r.ok) return [];
    const files = await r.json();
    if(!Array.isArray(files)) return [];
    return files
      .filter(f => f.type === "file" && IMG_RE.test(f.name))
      .sort((a,b) => a.name.localeCompare(b.name, undefined, {numeric:true}))
      .map(f => ({ url:f.download_url, caption:prettify(f.name) }));
  }catch(e){ return []; }
}

const DEMO = [
  { kind:"note", url:card("💌", "notes from us", "add handwritten\nnotes to the\nnotes folder"), caption:"a little note" },
  { kind:"photo",url:card("📷", "your photos here", "drop pictures into\nthe photos folder"), caption:"first photo" }
];

function card(emoji, title, sub){
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='400' height='520'>
    <rect width='100%' height='100%' fill='#f3e7dc'/>
    <text x='50%' y='38%' font-size='120' text-anchor='middle'>${emoji}</text>
    <text x='50%' y='58%' font-size='30' text-anchor='middle' fill='#6a4a52' font-family='sans-serif'>${title}</text>
    ${sub.split("\n").map((l,i)=>`<text x='50%' y='${68+i*7}%' font-size='18' text-anchor='middle' fill='#9a7a82' font-family='sans-serif'>${l}</text>`).join("")}
  </svg>`;
  return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
}

let frames = [], i = 0;

async function boot(){
  try{
    const cached = sessionStorage.getItem("frames");
    if(cached) frames = JSON.parse(cached);
  }catch(e){}

  if(!frames.length){
    const [notes, photos] = await Promise.all([
      listFolder(CONFIG.notesPath),
      listFolder(CONFIG.photosPath)
    ]);
    frames = [
      ...notes.map(f => ({...f, kind:"note"})),
      ...photos.map(f => ({...f, kind:"photo"}))
    ];
    if(frames.length){
      try{ sessionStorage.setItem("frames", JSON.stringify(frames)); }catch(e){}
    }
  }
  if(!frames.length) frames = DEMO;
  render();
}

function preload(n){
  const f = frames[(n+frames.length)%frames.length];
  if(f){ const im = new Image(); im.src = f.url; }
}

function render(){
  const f = frames[i];
  lcd.classList.toggle("is-note", f.kind === "note");
  statLabel.textContent = f.kind === "note" ? "NOTE" : "PLAY";
  frameImg.classList.remove("show");
  const next = new Image();
  next.onload = () => { frameImg.src = f.url; frameImg.classList.add("show"); };
  next.onerror = () => { frameImg.src = f.url; frameImg.classList.add("show"); };
  next.src = f.url;
  cap.textContent = f.caption || (f.kind === "note" ? "a note" : "");
  count.textContent = (i+1) + "/" + frames.length;
  preload(i+1); preload(i-1);
}

function go(step){
  i = (i + step + frames.length) % frames.length;
  render();
}

function home(){ i = 0; render(); }

$("btnPrev").onclick  = () => go(-1);
$("btnPrev2").onclick = () => go(-1);
$("btnNext").onclick  = () => go(1);
$("btnNext2").onclick = () => go(1);
$("btnHome").onclick  = home;
$("btnInfo").onclick  = () => lcd.classList.toggle("hud-off");

window.addEventListener("keydown", e => {
  if(e.key === "ArrowLeft")  go(-1);
  if(e.key === "ArrowRight") go(1);
  if(e.key === "Home")       home();
});

// QR
const modal = $("modal");
$("shareBtn").onclick = openQR;
$("closeModal").onclick = () => modal.classList.remove("open");
modal.addEventListener("click", e => { if(e.target === modal) modal.classList.remove("open"); });

function openQR(){
  const url = location.href.split("#")[0];
  $("urlText").textContent = url;
  modal.classList.add("open");
  const box = $("qrbox");
  box.innerHTML = "generating…";
  const draw = () => { box.innerHTML = ""; new QRCode(box, {text:url, width:190, height:190, correctLevel:QRCode.CorrectLevel.M}); };
  if(window.QRCode){ draw(); }
  else{
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";
    s.onload = draw;
    s.onerror = () => { box.innerHTML = "<span style='font-size:12px;color:#9a7a82'>couldn't load QR</span>"; };
    document.head.appendChild(s);
  }
}

boot();
</script>
</body>
</html>
